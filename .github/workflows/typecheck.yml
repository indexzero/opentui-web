name: Typecheck browser and tests

on:
  push:
    paths:
      - 'packages/opentui-browser/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/typecheck.yml'
  pull_request:
    paths:
      - 'packages/opentui-browser/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/typecheck.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @indexzero/opentui-browser typecheck
      - run: pnpm --filter @indexzero/opentui-browser test
      - run: pnpm --filter @indexzero/opentui-browser build
